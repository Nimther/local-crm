name: Images

# Phase 14 plan 06 (OPS-01, D-03). Builds the three deployable images
# (api/web/worker) on every push to master AND on every pull_request
# targeting master -- but PUSHES to GHCR only on the push-to-master path.
#
# Phase 14 plan 14 (G-14-4 gap closure): the pull_request path is new. G-14-4
# reached UAT precisely because nothing built a real Docker image before
# merge -- `ci.yml`'s `static`/`test`/`failure-injection` jobs all install
# under this repo's own npm 11 (`.nvmrc`), never under the npm 10 that
# node:22-slim bundles, so a lockfile that satisfied npm 11 but not npm 10
# (see .planning/debug/docker-npm-ci-lockfile-desync.md) sailed through every
# required check and only failed at `docker build` time, on a real host,
# after merge. The PR path here BUILDS all three images end to end (which
# also exercises the npm-10 `npm prune --omit=dev` step a plain
# `ci --dry-run` cannot reach) but never pushes -- this job is deliberately
# NOT a required status check; the blocking guarantee that a desynced
# lockfile cannot merge lives in Task 2's `check:lockfile-npm10` step inside
# `static` (a required check). This job is the end-to-end EVIDENCE behind
# that guarantee, proving the guard's npx-major-10 proxy actually matches
# what a real Docker build does. Removing either one because "the other
# covers it" reopens G-14-4 (see this plan's own key_links).
#
# A SEPARATE workflow from .github/workflows/ci.yml, deliberately, for two
# reasons that still hold with the pull_request trigger added:
#   1. Even on pull_request, this build-only job's own privilege boundary
#      (job-level `permissions: contents: read`, no login step, `push:
#      false`) is declared in this file's YAML, not implied by a conditional
#      buried inside a job that also has publish rights elsewhere.
#   2. `ci.yml`'s three required status checks (`static`, `test`,
#      `failure-injection`) stay untouched -- adding a fourth job there would
#      either become a fourth required check (slowing every PR down with a
#      build this workflow does not need to gate) or a non-required job
#      hiding inside a file whose whole point is "these are the required
#      checks".
#
# Push-to-master quality gate: `build-and-push`'s OWN trigger is now guarded
# by `if: github.event_name == 'push'`, and this repository's branch
# protection on `master` (`required_status_checks.contexts = ["static",
# "test", "failure-injection"]`, `enforce_admins.enabled = true`,
# `required_status_checks.strict = true`) -- verified via `gh api
# repos/:owner/:repo/branches/master/protection` at the time this file was
# written, not assumed -- already blocks any commit from reaching master
# without passing those three checks first. By the time the push-to-master
# path fires, the commit has therefore already passed CI; no additional
# `needs:`/`workflow_run` gate is required here. Re-run that same `gh api`
# call before trusting this claim again if branch protection is ever
# reconfigured.
#
# Elevation-of-privilege boundary (T-14-14-03): the workflow-level
# `permissions: packages: write` below exists ONLY for the push-to-master
# job's GHCR publish. The pull_request build-only job overrides it down to
# job-level `permissions: contents: read` and has no `docker/login-action`
# step at all -- a PR (including one opened from a fork) can build an image
# but can never authenticate to any registry, let alone publish one.
#
# Every third-party action is pinned to a full 40-character commit SHA with
# the version tag in a trailing comment, matching ci.yml's own stated
# convention (a floating tag can be re-pointed at attacker-controlled code
# that runs with this job's `packages: write` token and the checked-out
# tree). Every SHA below was resolved fresh via `gh api
# repos/<owner>/<repo>/git/refs/tags/<tag>` at the time this file was
# written -- never copied from training data or from RESEARCH.md's
# deliberately-placeholder skeleton. Task 3 reuses these same SHAs verbatim
# for the new pull_request job -- nothing was re-resolved or substituted.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.app }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        app: [api, web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR (like every OCI registry) requires a lowercase image reference.
      # `github.repository` preserves this repository's actual owner/name
      # casing verbatim -- a naive `ghcr.io/${{ github.repository }}/<app>`
      # tag is an invalid reference the moment either segment contains an
      # uppercase letter (true for this repository at the time this file was
      # written). GitHub Actions expressions have no built-in lowercase
      # function, so this is computed with a shell one-liner instead.
      - name: Compute lowercase image base
        id: image-base
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}
          push: true
          # Exactly one tag, derived from the full git SHA -- never `latest`,
          # never a branch name. A mutable tag is how a deploy script ends up
          # running something other than what it was asked for; OPS-03's
          # entire rollback story is "the tag names exactly one immutable
          # build". If a future change wants a convenience tag (e.g. a moving
          # `master` tag for quick local pulls), read this comment first and
          # weigh that cost against this workflow's whole reason for existing.
          tags: ${{ steps.image-base.outputs.base }}/${{ matrix.app }}:${{ github.sha }}
          # Phase 15 plan 11 (OPS-08/D-06): the frontend Sentry DSN, web
          # matrix entry ONLY -- Dockerfile.web's own `ARG VITE_SENTRY_DSN`
          # is the only Dockerfile of the three that declares it, so this is
          # a harmless no-op string for api/worker regardless. Read from
          # `vars` (a GitHub Actions repository VARIABLE), not `secrets` --
          # a Sentry DSN authorizes sending events to a project, not reading
          # from it, so it is deliberately not a secret (SPECIFICATION.md
          # §3); routing it through `secrets` would suggest to a future
          # contributor that it needs the same handling as GHCR's own
          # `secrets.GITHUB_TOKEN` above, which it does not.
          build-args: |
            ${{ matrix.app == 'web' && format('VITE_SENTRY_DSN={0}', vars.VITE_SENTRY_DSN) || '' }}

  # Phase 14 plan 14 (G-14-4 gap closure). Builds all three images on every
  # pull_request targeting master -- BUILD ONLY, never push. See the header
  # comment above for why this exists and why it is deliberately not a
  # required status check.
  build-only:
    name: build-only (${{ matrix.app }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # T-14-14-03: overrides the workflow-level `packages: write` down to
    # read-only contents access -- this job never authenticates to any
    # registry, so it never needs (and must never hold) publish rights, even
    # for a PR opened from a fork.
    permissions:
      contents: read
    strategy:
      matrix:
        app: [api, web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # No docker/login-action step, deliberately -- this job never
      # authenticates to GHCR or any other registry.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}
          push: false
          # GitHub Actions cache backend, both directions -- without this a
          # full three-image build (each with its own multi-stage `npm ci` +
          # `npm run build`) would dominate PR latency on every single push
          # to the PR branch, most of which touch neither the lockfile nor
          # the Dockerfiles.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Same web-only build-arg as build-and-push above (this job never
          # pushes, so a fork PR without access to a configured
          # `vars.VITE_SENTRY_DSN` still builds successfully -- an
          # empty/absent value is the documented no-op default, T-15-33).
          build-args: |
            ${{ matrix.app == 'web' && format('VITE_SENTRY_DSN={0}', vars.VITE_SENTRY_DSN) || '' }}
