# GSD 08-04 (WRK-12): the durability and eviction posture of the BullMQ queue
# backend, under version control so it is identical everywhere it is applied.
#
# Two consumers boot from THIS file, which is what keeps them equivalent:
#   - docker-compose's `redis` service, which mounts it read-only and loads it
#     via an explicit `command:` override;
#   - packages/test-support/src/harness/temp-redis.ts, which starts a throwaway
#     redis-server from it on a free port so the same configuration can be
#     verified on a machine with no Docker installed.
# scripts/verify-redis-config.mjs asserts these values against a live server and
# is the same script in both cases; only its REDIS_URL differs.
#
# maxmemory and maxmemory-policy are required TOGETHER. `noeviction` is already
# the Redis default, so on its own it proves nothing — it can never trigger
# while maxmemory is 0 (unlimited). Without the ceiling, Redis under memory
# pressure silently evicts BullMQ job state and the queue loses work with no
# error anywhere. That is the failure this file exists to prevent, and asserting
# the policy alone would have passed against a completely unconfigured server.
#
# 512mb is a development figure chosen to be a real ceiling, not a measured one.
# Sizing it against the production VPS belongs to Phase 15. It is deliberately
# NOT parameterized through an environment variable: redis.conf has no native
# variable substitution, and adding an entrypoint wrapper to get it would
# reintroduce exactly the local-versus-CI configuration divergence D-03 and D-25
# exist to prevent.
maxmemory 512mb
maxmemory-policy noeviction

# appendfsync everysec, not always, is a deliberate throughput tradeoff (D-26):
# it bounds worst-case loss to one second of writes while avoiding an fsync on
# every command. A `docker restart` sends SIGTERM, and Redis performs a final
# fsync on a clean shutdown, so enqueued jobs survive it — which is what 08-13
# asserts directly. Revisit at Phase 12 (worker reliability) and Phase 14.
appendonly yes
appendfsync everysec
