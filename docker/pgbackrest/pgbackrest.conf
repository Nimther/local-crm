# Phase 14 plan 10 (DB-09, D-05, D-06). ONE stanza ("mega_crm") for this
# platform's single database -- shared verbatim by the `db` service (whose
# own `archive_command`, set in docker/postgres/prod-tls-entrypoint.sh, runs
# `pgbackrest archive-push` against this exact file) and the `pgbackrest`
# sidecar service (docker/pgbackrest/backup-entrypoint.sh, which runs the
# scheduled `backup`/`check` commands against it) -- one configuration, read
# by two containers, never a second copy that could drift.
#
# Every value below that is a credential or an S3 endpoint is read from the
# environment via pgBackRest's OWN `PGBACKREST_<OPTION>` override convention
# (pgbackrest.org/command.html "Environment Variables": the option name
# upper-cased with `-` -> `_`, prefixed `PGBACKREST_`) -- confirmed directly
# against this file's own local dry-run (see docs/runbooks/backups.md) and
# NEVER embedded as a literal here:
#   repo1-s3-endpoint     -> PGBACKREST_REPO1_S3_ENDPOINT
#   repo1-s3-bucket       -> PGBACKREST_REPO1_S3_BUCKET
#   repo1-s3-region       -> PGBACKREST_REPO1_S3_REGION
#   repo1-s3-key          -> PGBACKREST_REPO1_S3_KEY
#   repo1-s3-key-secret   -> PGBACKREST_REPO1_S3_KEY_SECRET
#   repo1-cipher-pass     -> PGBACKREST_REPO1_CIPHER_PASS
# docker/docker-compose.prod.yml's `db` and `pgbackrest` services both
# deliver all six via `environment:` (the SAME externally-resolved
# MEGA_CRM_ENV_FILE convention every secret in this project follows);
# docker/prod.env.example documents every name with no value.
#
# scripts/validate-prod-compose.mjs's compose-invariant gate greps this
# file for a literal credential value (comment lines excluded) and fails
# the build if it ever finds one.
[global]
repo1-type=s3
repo1-cipher-type=aes-256-cbc

# D-08 / plan 14-12: the retention window here is the ACTUAL recovery
# horizon for anything the partition-drop retention tick removes -- a
# dropped partition is recoverable ONLY from a backup, and ONLY until that
# backup expires. 2 full backups (count-based, pgBackRest's own default
# retention-type) kept online at any time: this week's Sunday full plus last
# week's, with every differential/incremental chained off each -- roughly
# two weeks of restorable history before the oldest full (and everything
# chained off it) is expired. See docker/pgbackrest/crontab's own header for
# the full cadence + the resulting RPO/RTO expectations, and
# docs/runbooks/backups.md for the operator-facing version of both --
# config files say WHAT, comments next to the schedule say WHY, this
# comment does not repeat either.
repo1-retention-full=2
repo1-retention-full-type=count

# Two parallel processes for compress/transfer -- fast enough for this
# platform's current data volume without contending hard with Postgres for
# CPU on a modest single-VPS host (docs/runbooks/production-topology.md's
# minimum-viable-VPS sizing: 2vCPU floor, 4vCPU recommended). Revisit
# alongside that runbook's own sizing revisit triggers if backup duration
# ever becomes a problem.
process-max=2

log-level-console=info
log-level-file=detail

[mega_crm]
pg1-path=/var/lib/postgresql/data
# The `pgbackrest` sidecar is a SEPARATE container from `db` -- it has no
# TCP credential of its own and needs none: docker-compose.prod.yml mounts
# BOTH the Postgres data volume (read-only) and a NEW shared volume at
# /var/run/postgresql between the two containers, so pgBackRest's own
# backup-start/backup-stop control connection reaches the exact same Unix
# socket file `db`'s own Postgres process listens on. PostgreSQL's `initdb`
# defaults an unauthenticated `local` (Unix-socket) pg_hba.conf entry to
# `trust` "for ease of installation" (postgresql.org/docs/17/app-initdb.html)
# -- confirmed neither docker/postgres/prod-tls-entrypoint.sh nor the
# official image's own docker-entrypoint.sh ever narrows that `local` line
# (only the `host` line is tightened, to the configured password-encryption
# method) -- so this is the SAME trust boundary a process with read access
# to PGDATA already sits inside, not a new one: anything that can read the
# raw data files off the shared volume could already read every row in the
# cluster directly, with or without a socket connection.
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
